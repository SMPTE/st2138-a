# A shared, namespaced geometry library imported by the case root. Its `segment`
# type references the sibling `point` type internally through template_oid, so both
# endpoints inherit the coordinate fields and range constraints without repeating
# them. These internal references are written relative to the library's own scope,
# so they must resolve wherever the library is mounted in a consuming descriptor.
type: STRUCT
client_hints:
  st2138_namespace: shared.geo

params:
  point:
    type: STRUCT
    client_hints:
      st2138_definition_only: "true"
    name:
      display_strings:
        en: Point
    params:
      latitude:
        type: FLOAT32
        constraint:
          type: FLOAT_RANGE
          float_range:
            min_value: -90.0
            max_value: 90.0
      longitude:
        type: FLOAT32
        constraint:
          type: FLOAT_RANGE
          float_range:
            min_value: -180.0
            max_value: 180.0

  segment:
    type: STRUCT
    client_hints:
      st2138_definition_only: "true"
    name:
      display_strings:
        en: Segment
    params:
      start:
        type: STRUCT
        template_oid: point
      end:
        type: STRUCT
        template_oid: point
