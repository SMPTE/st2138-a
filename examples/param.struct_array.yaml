# Example of a STRUCT_ARRAY parameter

name:
  display_strings:
    en: Premier League Football Grounds

type: STRUCT_ARRAY

params:
  team_name:
    type: STRING
  ground_name:
    type: STRING

value:
  struct_array_values:
    struct_values:
      - fields:
          team_name:
            string_value: Manchester United
          ground_name:
            string_value: Old Trafford
      - fields:
          team_name:
            string_value: Liverpool
          ground_name:
            string_value: Anfield
      - fields:
          team_name:
            string_value: Chelsea
          ground_name:
            string_value: Stamford Bridge
      - fields:
          team_name:
            string_value: Arsenal
          ground_name:
            string_value: Emirates Stadium
      - fields:
          team_name:
            string_value: Leeds United
          ground_name:
            string_value: Elland Road
