# Example of a DATA parameter

name:
  display_strings:
    en: Image

type: DATA

read_only: true

value:
  data_payload:
    # payload is "Hello, World!\n" encoded in base64
    # echo "Hello, World!" | base64
    payload: SGVsbG8sIFdvcmxkIQo=
    payload_encoding: UNCOMPRESSED
    metadata:
      mime-type: text/plain
    # digest is the base64-encoded sha256 of the raw (decoded) payload bytes
    # echo "Hello, World!" | openssl dgst -binary -sha256 | base64
    digest: yYwktnfv9Ehgr+pvSTu67FuxxMuyCcb8K7tH9m/yrTE=