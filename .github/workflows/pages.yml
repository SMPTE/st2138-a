name: "Build and Deploy GitHub Pages"
on:
  push:
    tags:
      - "v*"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tooling
        run: |
          ./install-tooling.sh
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

      - name: Build
        run: |
          ./build-openapi.sh
          VERSION="$(tr -d '[:space:]' < VERSION)"
          # the tag must equal the stamped VERSION so published $ids match their URL path
          if [[ "$VERSION" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match VERSION '$VERSION'; bump VERSION, run ./set-version.sh, commit, then tag."
            exit 1
          fi
          echo "Assembling publish tree for $VERSION"
          # assemble the schema/doc tree once; device.yaml is the exploded (anchor-free) build output
          stage="$(mktemp -d)"
          mkdir -p "$stage/interface/schema" "$stage/docs"
          cp interface/schema/* "$stage/interface/schema/"
          cp build/device.yaml "$stage/interface/schema/device.yaml"
          cp docs/openapi.yaml "$stage/docs/openapi.yaml"
          # versioned path plus /latest and bare aliases; copies, since Pages has no symlinks or redirects
          for dest in "publish/$VERSION" "publish/latest" "publish"; do
            mkdir -p "$dest"
            cp -r "$stage/." "$dest/"
          done

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: publish
          enable_jekyll: true
          keep_files: true
