name: "Publish"

on:
  # Primary path: called directly by the release-finish workflow once a release
  # PR merges. A tag pushed with GITHUB_TOKEN can't trigger a workflow, so the
  # release automation must invoke publishing rather than rely on the tag event.
  workflow_call:
    inputs:
      ref:
        description: "Git ref (tag or SHA) to build and publish."
        required: true
        type: string
      version:
        description: "Expected VERSION at that ref; asserted against the committed stamp."
        required: true
        type: string
  # Safety valve: a human-pushed tag for an emergency / manual re-publish.
  push:
    tags:
      - "*"

permissions:
  contents: write # deploy-pages pushes to gh-pages; release creates the GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gate.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Verify VERSION
        id: gate
        env:
          EXPECTED: ${{ inputs.version }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ -n "$EXPECTED" ]]; then
            # workflow_call: the caller already tagged; assert the stamp matches
            if [[ "$VERSION" != "$EXPECTED" ]]; then
              echo "::error::Caller expected VERSION '$EXPECTED' but ref has '$VERSION'."
              exit 1
            fi
          else
            # tag push: the tag must equal the stamped VERSION so published/packaged $ids match their URL path
            if [[ "$VERSION" != "$GITHUB_REF_NAME" ]]; then
              echo "::error::Tag '$GITHUB_REF_NAME' does not match VERSION '$VERSION'; bump VERSION, run ./scripts/set-version.sh, commit, then tag."
              exit 1
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup tooling
        uses: ./.github/actions/setup-tooling

      - name: Build
        run: ./build-openapi.sh

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          # device.yaml here is the exploded (anchor-free) build output consumed downstream
          path: |
            interface/schema/
            interface/proto/
            build/device.yaml
            docs/openapi.yaml
          if-no-files-found: error

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Assemble publish tree
        run: |
          echo "Assembling publish tree for $VERSION"
          stage="$(mktemp -d)"
          mkdir -p "$stage/interface/schema" "$stage/docs"
          cp interface/schema/* "$stage/interface/schema/"
          cp build/device.yaml "$stage/interface/schema/device.yaml"
          cp docs/openapi.yaml "$stage/docs/openapi.yaml"
          # versioned path plus /latest and bare aliases; copies, since Pages has no symlinks or redirects
          for dest in "publish/$VERSION" "publish/latest" "publish"; do
            mkdir -p "$dest"
            cp -r "$stage/." "$dest/"
          done

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: publish
          enable_jekyll: true
          keep_files: true

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Package artifacts
        run: |
          mkdir -p dist

          echo "Packaging protos for $VERSION"
          tar -czf "dist/st2138-protos-$VERSION.tgz" -C interface proto

          echo "Assembling full interface bundle for $VERSION"
          # self-contained snapshot; device.yaml is the exploded (anchor-free) build output
          stage="$(mktemp -d)"
          mkdir -p "$stage/interface/schema" "$stage/interface/proto" "$stage/docs"
          cp interface/schema/* "$stage/interface/schema/"
          cp build/device.yaml "$stage/interface/schema/device.yaml"
          cp interface/proto/*.proto "$stage/interface/proto/"
          cp docs/openapi.yaml "$stage/docs/openapi.yaml"
          tar -czf "dist/st2138-interface-$VERSION.tgz" -C "$stage" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # explicit because github.ref is not the tag on the workflow_call path
          tag_name: ${{ env.VERSION }}
          files: |
            dist/st2138-protos-*.tgz
            dist/st2138-interface-*.tgz
